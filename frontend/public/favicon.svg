<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Sapphire to Violet -->
    <linearGradient id="piqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glass Specular Rim Highlight -->
    <linearGradient id="piqRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Cap Surface Facet Gradient -->
    <linearGradient id="piqCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Lower Crest Shield / Cyan Flow -->
    <linearGradient id="piqCrest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64d2ff" />
      <stop offset="100%" stop-color="#0071e3" />
    </linearGradient>

    <!-- Golden Tassel & Star -->
    <linearGradient id="piqGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff9500" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="piqDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0b1120" flood-opacity="0.4" />
    </filter>

    <!-- Star Glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS 18 Rounded Squircle Background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#piqBg)" />

  <!-- Inner Specular Glass Border -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#piqRim)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- Top Glass Sheen -->
  <path d="M8 36 C8 20.5 20.5 8 36 8 L92 8 C107.5 8 120 20.5 120 36 C85 52 43 52 8 36 Z" fill="rgba(255,255,255,0.14)" />

  <!-- Main Symbol Group with Elevation -->
  <g filter="url(#piqDrop)">
    <!-- Academic Crest / IQ Shield Base -->
    <path d="M38 52 L38 68 C38 82 64 92 64 92 C64 92 90 82 90 68 L90 52 L64 64 Z" fill="url(#piqCrest)" />

    <!-- Analytical Progress Columns Inside Shield -->
    <rect x="51" y="70" width="5" height="11" rx="2.5" fill="#ffffff" opacity="0.85" />
    <rect x="61.5" y="65" width="5" height="16" rx="2.5" fill="#ffffff" opacity="0.95" />
    <rect x="72" y="60" width="5" height="21" rx="2.5" fill="#ffffff" opacity="1" />

    <!-- Mortarboard Diamond (Cap Top) -->
    <path d="M64 26 L102 44 L64 62 L26 44 Z" fill="url(#piqCap)" />

    <!-- Cap Underneath Shadow / Bevel -->
    <path d="M26 44 L64 62 L64 65 L26 47 Z" fill="rgba(0,0,0,0.12)" />
    <path d="M64 62 L102 44 L102 47 L64 65 Z" fill="rgba(0,0,0,0.18)" />

    <!-- Golden Academic Tassel -->
    <path d="M86 46 C94 52 97 62 96 74" fill="none" stroke="url(#piqGold)" stroke-width="3" stroke-linecap="round" />
    <circle cx="96" cy="77" r="4" fill="url(#piqGold)" />

    <!-- Intelligence Sparkle Diamond (Success Star) -->
    <path d="M96 22 Q96 27 101 27 Q96 27 96 32 Q96 27 91 27 Q96 27 96 22 Z" fill="url(#piqGold)" filter="url(#starGlow)" />
  </g>
</svg>